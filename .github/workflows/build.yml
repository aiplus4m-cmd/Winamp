name: Build & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.Substring(1) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build src/RetroAmp/RetroAmp.csproj -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Self-test (decode, DSP, UI + visualizer screenshots, yt-dlp)
        shell: pwsh
        run: |
          $exe = "src/RetroAmp/bin/Release/net48/RetroAmp.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "$pwd\selftest-out", "--online" -PassThru
          $done = $p.WaitForExit(480000)
          if (Test-Path selftest-out/selftest.log) { Get-Content selftest-out/selftest.log }
          if (-not $done) { $p.Kill(); throw "self-test timed out" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Dump screenshot preview (base64 JPEG)
        if: always() && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $files = Get-ChildItem selftest-out -Filter *.png | Sort-Object Name
          $tiles = $files | ForEach-Object { [System.Drawing.Image]::FromFile($_.FullName) }
          $tw = 400
          $rows = @(); $x = 0; $y = 0; $rowH = 0; $W = 1200; $H = 0
          foreach ($t in $tiles) { $h = [int]($t.Height * $tw / $t.Width); if ($x + $tw -gt $W) { $x = 0; $y += $rowH; $rowH = 0 }; $rows += ,@($t, $x, $y, $h); $x += $tw; if ($h -gt $rowH) { $rowH = $h } }
          $H = $y + $rowH
          $bmp = New-Object System.Drawing.Bitmap $W, $H
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.InterpolationMode = 'HighQualityBicubic'
          foreach ($r in $rows) { $g.DrawImage($r[0], $r[1], $r[2], $tw, $r[3]) }
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 72L
          $bmp.Save("$pwd\preview.jpg", $codec, $ep)
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$pwd\preview.jpg"))
          Write-Output "PREVIEW_BYTES $($b.Length)"
          for ($i = 0; $i -lt $b.Length; $i += 8000) { Write-Output ("JPG|" + $b.Substring($i, [Math]::Min(8000, $b.Length - $i))) }

      - name: Upload self-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest-out/*.png
            selftest-out/*.log

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "dist/RetroAmp"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src/RetroAmp/bin/Release/net48/RetroAmp.exe, src/RetroAmp/bin/Release/net48/RetroAmp.exe.config $out
          Copy-Item src/RetroAmp/bin/Release/net48/*.dll $out
          Copy-Item LICENSE "$out/LICENSE.txt"
          Set-Content "$out/portable.dat" "RetroAmp portable mode: settings, cache and tools are stored in the Data folder next to RetroAmp.exe. Delete this file to use %APPDATA% instead."
          Compress-Archive -Path "$out/*" -DestinationPath "dist/RetroAmp-$v-Portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/RetroAmp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: RetroAmp-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RetroAmp ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/RetroAmp-${{ steps.ver.outputs.version }}-Setup.exe
            dist/RetroAmp-${{ steps.ver.outputs.version }}-Portable.zip
