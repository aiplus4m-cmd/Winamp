name: Build & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/RetroAmp/RetroAmp.csproj
          $v = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.Substring(1) }
          "version=$v" >> $env:GITHUB_OUTPUT
          # Release when a tag is pushed, or when main gets a version that has no release yet
          $release = "false"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $release = "true" }
          elseif ($env:GITHUB_REF -eq "refs/heads/main" -and $env:GITHUB_EVENT_NAME -eq "push") {
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) { $release = "true" }
          }
          "release=$release" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: dotnet build src/RetroAmp/RetroAmp.csproj -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Self-test (decode, DSP, UI + visualizer screenshots, yt-dlp)
        shell: pwsh
        run: |
          $exe = "src/RetroAmp/bin/Release/net48/RetroAmp.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "$pwd\selftest-out", "--online" -PassThru
          $done = $p.WaitForExit(480000)
          if (Test-Path selftest-out/selftest.log) { Get-Content selftest-out/selftest.log }
          if (-not $done) { $p.Kill(); throw "self-test timed out" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Publish self-test preview (dev branches only)
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force preview | Out-Null
          Copy-Item selftest-out/*.png, selftest-out/*.log preview -ErrorAction SilentlyContinue
          cd preview
          git init -q -b ci-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "self-test preview for $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-preview

      - name: Upload self-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest-out/*.png
            selftest-out/*.log

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "dist/RetroAmp"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src/RetroAmp/bin/Release/net48/RetroAmp.exe, src/RetroAmp/bin/Release/net48/RetroAmp.exe.config $out
          Copy-Item src/RetroAmp/bin/Release/net48/*.dll $out
          Copy-Item LICENSE "$out/LICENSE.txt"
          Set-Content "$out/portable.dat" "RetroAmp portable mode: settings, cache and tools are stored in the Data folder next to RetroAmp.exe. Delete this file to use %APPDATA% instead."
          Compress-Archive -Path "$out/*" -DestinationPath "dist/RetroAmp-$v-Portable.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/RetroAmp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: RetroAmp-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe

      - name: Publish GitHub release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RetroAmp ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/RetroAmp-${{ steps.ver.outputs.version }}-Setup.exe
            dist/RetroAmp-${{ steps.ver.outputs.version }}-Portable.zip
